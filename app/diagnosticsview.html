<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Device Diagnostics</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg:#05080d; --fg:#e8eef6; --muted:#c2d1e0; --dim:#8194a8; --surf:#16232f; --surf2:#0e1822;
    --tile-bd:#2a3b4e; --accent:#7CFFB2;
    --ok:#3ddc84; --ok-bd:#1f6b43; --ok-tint:rgba(61,220,132,.10);
    --fail:#ff5a5a; --fail-bd:#7a2530; --fail-tint:rgba(255,90,90,.13);
    --note:#ffbf47; --note-bd:#7a5c1e; --note-tint:rgba(255,191,71,.12);
  }
  body.light { --bg:#e6ecf3; --fg:#12202c; --muted:#37485a; --dim:#5b6b7a; --surf:#ffffff; --surf2:#dde5ee;
    --tile-bd:#c3cfdb; --ok:#1fae5f; --ok-bd:#8fd0aa; --ok-tint:rgba(31,174,95,.10);
    --fail:#e23b3b; --fail-bd:#ee7979; --fail-tint:rgba(226,59,59,.10);
    --note:#c98a00; --note-bd:#e6c98a; --note-tint:rgba(201,138,0,.12); }
  html, body { margin:0; width:100%; height:100%; }
  html, body, button { font-family:"Segoe UI", system-ui, sans-serif; }
  body { background:var(--bg); color:var(--fg); overflow:hidden; user-select:none; touch-action:manipulation; }
  .ic svg { width:100%; height:100%; fill:currentColor; display:block; }

  #wrap { display:flex; flex-direction:column; width:100vw; height:100vh; padding:20px 26px; gap:14px; }

  /* ---- header ---- */
  #head { flex:0 0 auto; display:flex; align-items:center; gap:20px; min-height:58px; }
  #title { font-size:26px; font-weight:800; letter-spacing:.3px; }
  #device { display:flex; flex-direction:column; line-height:1.15; }
  #device .dname { font-size:20px; font-weight:700; color:var(--fg); }
  #device .dsub { font-size:14px; font-weight:600; color:var(--dim); }
  #spacer { flex:1; }
  #health { display:flex; align-items:center; gap:12px; height:52px; padding:0 22px; border-radius:13px;
    font-size:20px; font-weight:800; border:1px solid var(--tile-bd); }
  #health .dot { width:16px; height:16px; border-radius:50%; }
  #health.ok { background:var(--ok-tint); border-color:var(--ok-bd); color:var(--ok); }
  #health.ok .dot { background:var(--ok); }
  #health.bad { background:var(--fail-tint); border-color:var(--fail-bd); color:var(--fail); }
  #health.bad .dot { background:var(--fail); animation:pulse 1.4s infinite; }
  #health.soft { background:var(--surf); color:var(--dim); }
  #health.soft .dot { background:var(--dim); }

  /* ---- channel rows ---- */
  #rows { flex:1; display:flex; flex-direction:column; gap:14px; min-height:0; }
  .row { flex:1; display:flex; align-items:center; gap:22px; padding:0 26px; border-radius:16px;
    background:var(--surf2); border:1px solid var(--tile-bd); transition:background .15s, border-color .15s; }
  .row .badge { width:70px; height:70px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    flex:0 0 auto; }
  .row .badge .ic { width:40px; height:40px; }
  .row .body { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .row .rname { font-size:27px; font-weight:800; letter-spacing:.2px; }
  .row .rdetail { font-size:18px; font-weight:600; color:var(--muted); line-height:1.3; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .row .status { flex:0 0 auto; display:flex; align-items:center; gap:12px; font-size:22px; font-weight:800; }
  .row .status .sic { width:34px; height:34px; }

  /* per-level treatment; the failed/degraded one is emphasized (auto-expand = the eye goes here) */
  .row.ok    { }
  .row.ok    .badge { background:var(--ok-tint); color:var(--ok); }
  .row.ok    .status { color:var(--ok); }
  .row.ok    .rdetail { color:var(--dim); -webkit-line-clamp:1; }
  .row.fail  { background:var(--fail-tint); border-color:var(--fail-bd); }
  .row.fail  .badge { background:var(--fail); color:#1a0505; }
  .row.fail  .status { color:var(--fail); }
  .row.fail  .rname { color:var(--fail); }
  .row.note  { background:var(--note-tint); border-color:var(--note-bd); }
  .row.note  .badge { background:var(--note-tint); color:var(--note); }
  .row.note  .status { color:var(--note); }
  .row.soft  .badge { background:var(--surf); color:var(--dim); }
  .row.soft  .status { color:var(--dim); }
  .row.soft  .rname { color:var(--muted); }

  /* the auto-expanded (worst) row gets a ring + full-height detail */
  .row.expand { box-shadow:0 0 0 2px currentColor inset; }
  .row.expand .rdetail { -webkit-line-clamp:2; }

  #foot { flex:0 0 auto; font-size:13px; color:var(--dim); text-align:center; min-height:16px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
</style>
</head>
<body>
  <div id="wrap">
    <div id="head">
      <div id="title">Device Diagnostics</div>
      <div id="device"><span class="dname" id="dName">Checking…</span><span class="dsub" id="dSub"></span></div>
      <div id="spacer"></div>
      <div id="health" class="soft"><span class="dot"></span><span id="healthText">…</span></div>
    </div>
    <div id="rows"></div>
    <div id="foot"></div>
  </div>
  <script src="diagnosticsview.js"></script>
</body>
</html>
